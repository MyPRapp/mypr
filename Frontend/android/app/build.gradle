plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def loadFlutterConfig() {
    def flutterConfig = [:]
    def pubspec = file("../../pubspec.yaml")
    if (!pubspec.exists()) {
        throw new GradleException("pubspec.yaml file not found")
    }

    pubspec.eachLine { line ->
        if (line.startsWith("version:")) {
            def version = line.split(":")[1].trim()
            flutterConfig['versionName'] = version.split("\\+")[0].trim()
            flutterConfig['versionCode'] = version.split("\\+")[1].trim().toInteger()
        }
    }

    // Setting default values if the keys are not found
    flutterConfig['versionName'] = flutterConfig.get('versionName', "1.0.0")
    flutterConfig['versionCode'] = flutterConfig.get('versionCode', 1)

    return flutterConfig
}

def flutterConfig = loadFlutterConfig()


// Define SDK versions in one place
def compileSdkVersion = 34
def minSdkVersion = 21
def targetSdkVersion = 34
def NDKVersion = "28.0.12433566"

android {
    namespace = "com.etairia.mypr"
    compileSdk = compileSdkVersion
    ndkVersion = NDKVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.etairia.mypr"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = minSdkVersion
        targetSdk = targetSdkVersion
        versionCode = flutterConfig['versionCode']
        versionName = flutterConfig['versionName']
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release  // Use the release signing configuration
            minifyEnabled true  // Enable code shrinking, obfuscation, and optimization
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}
